<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Vocabulary Mindmap</title>
    <!-- Tailwind CSS for robust, parallel-layer styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for precise visual cues -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* CSS Vận hành Mạng nhện - The Threads */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; overflow: hidden; }
        .mindmap-canvas { height: calc(100vh - 64px); overflow: auto; background-image: radial-gradient(#e2e8f0 1px, transparent 1px); background-size: 20px 20px; }
        
        /* The Connecting Lines */
        .tree-children { position: relative; padding-left: 2rem; margin-top: 0.5rem; transition: all 0.3s ease-in-out; }
        .tree-children::before { content: ""; position: absolute; left: 0.75rem; top: 0; bottom: 0; width: 2px; background: currentColor; opacity: 0.3; border-radius: 4px; }
        .tree-node { position: relative; }
        .tree-node::before { content: ""; position: absolute; left: -1.25rem; top: 1.5rem; width: 1.25rem; height: 2px; background: currentColor; opacity: 0.3; }

        /* The Pearls: Active Recall Mode */
        .recall-mode .vocab-meaning, .recall-mode .vocab-notes {
            filter: blur(8px);
            opacity: 0.2;
            transition: all 0.3s ease;
            user-select: none;
        }
        .recall-mode .vocab-card:hover .vocab-meaning, 
        .recall-mode .vocab-card:hover .vocab-notes {
            filter: blur(0);
            opacity: 1;
        }

        /* Aesthetics */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .highlight { box-shadow: 0 0 0 4px rgba(234, 179, 8, 0.5); transform: scale(1.02); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Lớp Điều phối (Top Navigation) -->
    <header class="bg-slate-900 text-white h-16 flex items-center justify-between px-6 shadow-md shrink-0 z-20">
        <div class="flex items-center gap-3">
            <i class="fa-solid fa-brain text-emerald-400 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wider">ZENITH MINDMAP</h1>
        </div>
        
        <div class="flex-1 max-w-xl mx-8 relative">
            <i class="fa-solid fa-search absolute left-3 top-2.5 text-gray-400"></i>
            <input type="text" id="searchInput" placeholder="Search across the web..." 
                class="w-full bg-slate-800 text-white rounded-full py-1.5 pl-10 pr-4 focus:outline-none focus:ring-2 focus:ring-emerald-400 transition-all">
        </div>

        <div class="flex items-center gap-4">
            <!-- Nút Kết nối File Ổ D/E (File System Access API) -->
            <button id="connectDiskBtn" onclick="DiskFileSystemManager.selectDiskFile()" class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-emerald-400 px-3 py-1.5 rounded-full text-xs font-semibold transition-all border border-slate-700" title="Kết nối File Ổ D/E (Tự động lưu vĩnh viễn)">
                <i class="fa-solid fa-hard-drive text-emerald-400"></i>
                <span id="diskBtnText">Connect Disk D/E</span>
            </button>
            <div class="h-6 w-px bg-slate-600"></div>

            <button id="toggleRecallBtn" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 px-4 py-1.5 rounded-full font-semibold transition-all">
                <i class="fa-solid fa-eye-slash"></i> Active Recall
            </button>
            <div class="h-6 w-px bg-slate-600"></div>
            <button onclick="exportData()" class="text-slate-300 hover:text-emerald-400 transition-colors" title="Export JSON">
                <i class="fa-solid fa-download text-lg"></i>
            </button>
            <label class="cursor-pointer text-slate-300 hover:text-amber-400 transition-colors" title="Import JSON">
                <i class="fa-solid fa-upload text-lg"></i>
                <input type="file" id="importInput" accept=".json" class="hidden" onchange="importData(event)">
            </label>
        </div>
    </header>

    <!-- Lớp Kết cấu (Main Layout) -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Tâm mạng nhện (Topics Sidebar) -->
        <aside class="w-72 bg-white border-r border-slate-200 flex flex-col z-10 shadow-[4px_0_15px_rgba(0,0,0,0.03)]">
            <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider">Topics</h2>
                <button onclick="openModal('topic')" class="text-emerald-600 hover:text-emerald-700 hover:bg-emerald-50 p-1.5 rounded transition-all">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </div>
            <div id="topicsList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Topics Rendered Here -->
            </div>
        </aside>

        <!-- Lớp Song song (Mindmap Canvas) -->
        <main class="flex-1 mindmap-canvas relative" id="mindmapCanvas">
            <div id="mindmapContainer" class="min-w-max p-12 transition-all duration-500">
                <!-- Mindmap Nodes Rendered Here -->
            </div>
        </main>
    </div>

    <!-- The Universal Modal (Form nhập liệu động) -->
    <div id="modalOverlay" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden flex-center justify-center items-center z-50">
        <div class="bg-white rounded-xl shadow-2xl w-96 transform scale-95 opacity-0 transition-all duration-200" id="modalContent">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Title</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-red-500"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div class="p-5 space-y-4" id="modalForm">
                <!-- Dynamic Inputs -->
            </div>
            <div class="p-5 bg-slate-50 rounded-b-xl flex justify-end gap-3 border-t border-slate-100">
                <button onclick="closeModal()" class="px-4 py-2 text-slate-600 hover:bg-slate-200 rounded-lg font-medium transition-colors">Cancel</button>
                <button id="modalSubmit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg font-medium shadow-md transition-all">Confirm</button>
            </div>
        </div>
    </div>

    <script>
        /** 
         * LÕI XỬ LÝ (THE ENGINE)
         * Kiến trúc dữ liệu dựa trên các Node (Chủ đề) -> Branches (Nhóm) -> Pearls (Từ vựng)
         */
        
        let appData = {
            topics: [],
            activeTopicId: null
        };

        let currentModalAction = null;
        let searchQuery = "";
        let recallMode = false;

        // ============================================
        // INDEXEDDB ENGINE (LƯU THẺ FILEHANDLE)
        // ============================================
        const DatabaseManager = (() => {
            const DB_NAME = "ZenithVocabDB";
            const DB_VERSION = 1;
            let db = null;

            const init = () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (e) => {
                        const tempDb = e.target.result;
                        if (!tempDb.objectStoreNames.contains("handles")) {
                            tempDb.createObjectStore("handles", { keyPath: "id" });
                        }
                    };
                    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    request.onerror = (e) => reject(e.target.error);
                });
            };

            const saveFileHandle = async (handle) => {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction("handles", "readwrite");
                    const req = tx.objectStore("handles").put({ id: "main_file_handle", handle });
                    req.onsuccess = () => resolve();
                    req.onerror = (e) => reject(e);
                });
            };

            const getFileHandle = async () => {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction("handles", "readonly");
                    const req = tx.objectStore("handles").get("main_file_handle");
                    req.onsuccess = (e) => resolve(e.target.result?.handle || null);
                    req.onerror = (e) => reject(e);
                });
            };

            return { init, saveFileHandle, getFileHandle };
        })();

        // ============================================
        // NATIVE FILE SYSTEM ACCESS API ENGINE
        // ============================================
        const DiskFileSystemManager = (() => {
            let cachedHandle = null;

            const updateStatusUI = (text, isSuccess = false) => {
                const btnText = document.getElementById('diskBtnText');
                if (btnText) {
                    btnText.innerText = text;
                    if (isSuccess) {
                        btnText.classList.add('text-emerald-400');
                    } else {
                        btnText.classList.remove('text-emerald-400');
                    }
                }
            };

            const verifyPermission = async (fileHandle, readWrite) => {
                const options = {};
                if (readWrite) options.mode = "readwrite";
                if ((await fileHandle.queryPermission(options)) === "granted") return true;
                if ((await fileHandle.requestPermission(options)) === "granted") return true;
                return false;
            };

            // 1. CHỌN FILE LẦN ĐẦU TỪ Ổ D/E
            const selectDiskFile = async () => {
                if (!window.showOpenFilePicker && !window.showSaveFilePicker) {
                    alert("Trình duyệt không hỗ trợ File System Access API. Vui lòng sử dụng Chrome hoặc Edge.");
                    return;
                }
                try {
                    let fileHandle;
                    if (window.showOpenFilePicker) {
                        const [handle] = await window.showOpenFilePicker({
                            types: [{
                                description: 'JSON Database File',
                                accept: { 'application/json': ['.json'] }
                            }],
                            multiple: false
                        });
                        fileHandle = handle;
                    } else {
                        fileHandle = await window.showSaveFilePicker({
                            suggestedName: 'zenith_vocab_mindmap.json',
                            types: [{
                                description: 'JSON Files',
                                accept: { 'application/json': ['.json'] }
                            }]
                        });
                    }

                    if (fileHandle) {
                        cachedHandle = fileHandle;
                        await DatabaseManager.saveFileHandle(fileHandle);
                        const file = await fileHandle.getFile();
                        const content = await file.text();

                        if (content.trim()) {
                            try {
                                const imported = JSON.parse(content);
                                if (imported.topics && Array.isArray(imported.topics)) {
                                    appData = imported;
                                    render();
                                }
                            } catch (e) {
                                console.error("Không thể đọc file JSON hiện tại:", e);
                            }
                        } else {
                            await saveToDisk();
                        }

                        updateStatusUI(`Connected: ${fileHandle.name}`, true);
                        alert(`Đã kết nối thành công với file "${fileHandle.name}" trên ổ D/E! Mọi thay đổi sẽ tự động ghi đè vĩnh viễn.`);
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error("Lỗi kết nối đĩa cứng:", err);
                        alert("Lỗi kết nối file: " + err.message);
                    }
                }
            };

            // 2. TỰ ĐỘNG NẠP FILE TỪ THẺ LƯU TRONG INDEXEDDB KHI MỞ TRÌNH DUYỆT
            const autoLoadFromDisk = async () => {
                try {
                    cachedHandle = await DatabaseManager.getFileHandle();
                    if (!cachedHandle) {
                        updateStatusUI("Connect Disk D/E", false);
                        return;
                    }

                    const hasPermission = await verifyPermission(cachedHandle, false);
                    if (hasPermission) {
                        const file = await cachedHandle.getFile();
                        const content = await file.text();
                        if (content.trim()) {
                            const imported = JSON.parse(content);
                            if (imported.topics && Array.isArray(imported.topics)) {
                                appData = imported;
                                render();
                                updateStatusUI(`Connected: ${cachedHandle.name}`, true);
                            }
                        }
                    } else {
                        updateStatusUI(`Re-connect: ${cachedHandle.name}`, false);
                    }
                } catch (err) {
                    console.error("Lỗi tự động nạp file từ thẻ IndexedDB:", err);
                    updateStatusUI("File moved/renamed", false);
                }
            };

            // 3. TỰ ĐỘNG GHI ĐÈ TRỰC TIẾP VÀO FILE TRÊN Ổ D/E
            const saveToDisk = async () => {
                try {
                    if (!cachedHandle) cachedHandle = await DatabaseManager.getFileHandle();
                    if (!cachedHandle) return;

                    const hasPermission = await verifyPermission(cachedHandle, true);
                    if (!hasPermission) return;

                    const writable = await cachedHandle.createWritable();
                    await writable.write(JSON.stringify(appData, null, 2));
                    await writable.close();
                } catch (err) {
                    console.error("Lỗi ghi file xuống ổ đĩa vật lý:", err);
                }
            };

            return { selectDiskFile, autoLoadFromDisk, saveToDisk };
        })();

        // Khởi tạo & Phục hồi dữ liệu
        async function init() {
            try {
                await DatabaseManager.init();
            } catch (e) {
                console.error("Lỗi khởi tạo IndexedDB:", e);
            }

            const saved = localStorage.getItem('zenithVocabData');
            if (saved) {
                try {
                    appData = JSON.parse(saved);
                } catch (e) {
                    console.error("Shattered Data Pearl detected. Resetting...", e);
                }
            }
            if (appData.topics.length === 0) {
                // Mẫu thử (Scenario Demo)
                const demoId = generateId();
                appData.topics.push({
                    id: demoId, name: "Strategic Business",
                    groups: [{
                        id: generateId(), name: "Negotiation", color: "#3b82f6", expanded: true,
                        words: [
                            { id: generateId(), term: "Leverage", meaning: "Power to influence a person or situation", notes: "Use when you have an advantage." },
                            { id: generateId(), term: "Concession", meaning: "A thing that is granted in response to demands", notes: "" }
                        ]
                    }]
                });
                appData.activeTopicId = demoId;
            }
            if(!appData.activeTopicId && appData.topics.length > 0) {
                appData.activeTopicId = appData.topics[0].id;
            }

            setupEventListeners();
            render();

            await DiskFileSystemManager.autoLoadFromDisk();
        }

        // TẦNG LƯU TRỮ ĐA LỚP (LOCALSTORAGE + FILE SYSTEM ACCESS API)
        function saveData() {
            localStorage.setItem('zenithVocabData', JSON.stringify(appData));
            DiskFileSystemManager.saveToDisk();
        }

        // Tạo ID định danh tuyệt đối
        function generateId() { return Date.now().toString(36) + Math.random().toString(36).substring(2); }
        
        // Cấp phát màu sắc hệ sinh thái theo hàm HSL
        function generateColor() {
            const hue = Math.floor(Math.random() * 360);
            return `hsl(${hue}, 70%, 45%)`;
        }

        /**
         * LỚP KẾT XUẤT DOM (RENDER LAYER)
         */
        function render() {
            renderSidebar();
            renderMindmap();
        }

        function renderSidebar() {
            const list = document.getElementById('topicsList');
            list.innerHTML = '';
            appData.topics.forEach(topic => {
                const isActive = topic.id === appData.activeTopicId;
                const div = document.createElement('div');
                div.className = `flex justify-between items-center p-3 rounded-lg cursor-pointer transition-all ${isActive ? 'bg-indigo-50 border-l-4 border-indigo-600' : 'hover:bg-slate-100 border-l-4 border-transparent'}`;
                div.innerHTML = `
                    <span class="font-medium text-slate-700 truncate ${isActive ? 'text-indigo-700 font-bold' : ''}" onclick="selectTopic('${topic.id}')">${topic.name}</span>
                    <button onclick="deleteTopic('${topic.id}')" class="text-slate-400 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can text-sm"></i></button>
                `;
                list.appendChild(div);
            });
        }

        function renderMindmap() {
            const container = document.getElementById('mindmapContainer');
            container.innerHTML = '';
            
            const topic = appData.topics.find(t => t.id === appData.activeTopicId);
            if (!topic) {
                container.innerHTML = `<div class="flex items-center justify-center h-full text-slate-400 italic">Select or create a topic to weave your web.</div>`;
                return;
            }

            // Canvas Class Control
            const canvas = document.getElementById('mindmapCanvas');
            recallMode ? canvas.classList.add('recall-mode') : canvas.classList.remove('recall-mode');

            // Xây dựng Tâm Mạng Nhện (Root Node)
            const rootWrapper = document.createElement('div');
            rootWrapper.className = 'flex items-center';

            const rootCard = document.createElement('div');
            rootCard.className = 'bg-indigo-600 text-white px-6 py-4 rounded-xl shadow-lg border-2 border-indigo-700 z-10 min-w-[200px] relative';
            rootCard.innerHTML = `
                <div class="flex justify-between items-center gap-4">
                    <h2 class="text-2xl font-bold">${topic.name}</h2>
                    <button onclick="openModal('group')" class="bg-white/20 hover:bg-white/30 text-white p-2 rounded-full transition-colors" title="Add Branch">
                        <i class="fa-solid fa-plus"></i>
                    </button>
                </div>
            `;

            // Xây dựng Các Nhánh Song Song (Groups)
            const groupsContainer = document.createElement('div');
            groupsContainer.className = 'flex flex-col ml-12 border-l-4 border-slate-300 py-4 relative';
            // Cầu nối từ Root sang Nhánh đầu tiên
            groupsContainer.style.borderLeftColor = 'rgba(79, 70, 229, 0.4)';

            topic.groups.forEach(group => {
                const groupWrapper = document.createElement('div');
                groupWrapper.className = 'flex items-center my-3 relative tree-node';
                groupWrapper.style.color = group.color; // Chuyển màu cho kết nối

                // Tối ưu thuật toán tìm kiếm: Chỉ highlight hoặc hiển thị những phần liên quan
                let groupHasMatch = false;
                let filteredWords = group.words;

                if (searchQuery) {
                    const q = searchQuery.toLowerCase();
                    filteredWords = group.words.filter(w => 
                        w.term.toLowerCase().includes(q) || w.meaning.toLowerCase().includes(q) || (w.notes && w.notes.toLowerCase().includes(q))
                    );
                    if (filteredWords.length > 0 || group.name.toLowerCase().includes(q)) {
                        groupHasMatch = true;
                        group.expanded = true; // Tự động mở nhánh nếu tìm thấy
                    } else {
                        return; // Ẩn hoàn toàn nếu không match ở tầng này
                    }
                }

                const groupCard = document.createElement('div');
                groupCard.className = `bg-white px-5 py-3 rounded-lg shadow-md border-t-4 z-10 flex flex-col min-w-[220px] transition-all hover:shadow-lg`;
                groupCard.style.borderColor = group.color;
                
                groupCard.innerHTML = `
                    <div class="flex justify-between items-center gap-3">
                        <h3 class="font-bold text-slate-800 text-lg flex-1 cursor-pointer" onclick="toggleGroup('${group.id}')">
                            <i class="fa-solid ${group.expanded ? 'fa-folder-open' : 'fa-folder'} mr-2" style="color: ${group.color}"></i>${group.name}
                        </h3>
                        <div class="flex gap-2 text-slate-400">
                            <button onclick="openModal('word', '${group.id}')" class="hover:text-emerald-500"><i class="fa-solid fa-plus"></i></button>
                            <button onclick="deleteGroup('${group.id}')" class="hover:text-red-500"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;

                groupWrapper.appendChild(groupCard);

                // Xây dựng Ngọc Tri Thức (Words)
                if (group.expanded && filteredWords.length > 0) {
                    const wordsContainer = document.createElement('div');
                    wordsContainer.className = 'tree-children ml-8';
                    wordsContainer.style.color = group.color;

                    filteredWords.forEach(word => {
                        const isMatch = searchQuery && (word.term.toLowerCase().includes(searchQuery.toLowerCase()) || word.meaning.toLowerCase().includes(searchQuery.toLowerCase()));
                        
                        const wordCard = document.createElement('div');
                        wordCard.className = `vocab-card flex items-stretch bg-white rounded-lg shadow-sm border border-slate-200 my-2 z-10 tree-node ${isMatch ? 'highlight' : ''}`;
                        
                        wordCard.innerHTML = `
                            <div class="bg-slate-50 px-4 py-3 border-r border-slate-200 rounded-l-lg font-bold text-slate-800 w-40 flex-shrink-0 flex items-center justify-between">
                                <span>${word.term}</span>
                            </div>
                            <div class="px-4 py-3 flex-1 flex flex-col justify-center min-w-[250px]">
                                <span class="vocab-meaning text-slate-700 font-medium">${word.meaning}</span>
                                ${word.notes ? `<span class="vocab-notes text-sm text-slate-500 mt-1 italic">${word.notes}</span>` : ''}
                            </div>
                            <div class="px-3 py-3 border-l border-slate-100 flex flex-col gap-2 justify-center bg-slate-50 rounded-r-lg">
                                <button onclick="deleteWord('${group.id}', '${word.id}')" class="text-slate-300 hover:text-red-500"><i class="fa-solid fa-xmark"></i></button>
                            </div>
                        `;
                        wordsContainer.appendChild(wordCard);
                    });
                    groupWrapper.appendChild(wordsContainer);
                }
                
                // Nếu nhóm không có từ nào và đang mở, hiển thị thông báo nhẹ
                if (group.expanded && group.words.length === 0 && !searchQuery) {
                    const emptyState = document.createElement('div');
                    emptyState.className = 'tree-children ml-8';
                    emptyState.style.color = group.color;
                    emptyState.innerHTML = `<div class="tree-node text-slate-400 italic text-sm py-2 px-4 border border-dashed border-slate-300 rounded-lg bg-white">Branch is empty. Add knowledge.</div>`;
                    groupWrapper.appendChild(emptyState);
                }

                groupsContainer.appendChild(groupWrapper);
            });

            rootWrapper.appendChild(rootCard);
            if(topic.groups.length > 0 || searchQuery) {
                rootWrapper.appendChild(groupsContainer);
            }
            
            container.appendChild(rootWrapper);
        }

        /**
         * CƠ CHẾ LOGIC & BIẾN ĐỔI (OPERATIONAL LOGIC)
         */
        function selectTopic(id) { appData.activeTopicId = id; render(); }
        
        function deleteTopic(id) {
            if(!confirm('Xóa toàn bộ Cấu trúc (Topic) này? Mọi liên kết sẽ bị đứt gãy hoàn toàn.')) return;
            appData.topics = appData.topics.filter(t => t.id !== id);
            if(appData.activeTopicId === id) appData.activeTopicId = appData.topics.length ? appData.topics[0].id : null;
            saveAndRender();
        }

        function deleteGroup(groupId) {
            if(!confirm('Xóa Nhánh (Group) và tất cả từ vựng bên trong?')) return;
            const topic = appData.topics.find(t => t.id === appData.activeTopicId);
            topic.groups = topic.groups.filter(g => g.id !== groupId);
            saveAndRender();
        }

        function toggleGroup(groupId) {
            const topic = appData.topics.find(t => t.id === appData.activeTopicId);
            const group = topic.groups.find(g => g.id === groupId);
            group.expanded = !group.expanded;
            saveAndRender();
        }

        function deleteWord(groupId, wordId) {
            const topic = appData.topics.find(t => t.id === appData.activeTopicId);
            const group = topic.groups.find(g => g.id === groupId);
            group.words = group.words.filter(w => w.id !== wordId);
            saveAndRender();
        }

        function saveAndRender() { saveData(); render(); }

        /**
         * GIAO DIỆN NHẬP LIỆU (MODAL SYSTEM)
         */
        function openModal(type, targetId = null) {
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            const form = document.getElementById('modalForm');
            const title = document.getElementById('modalTitle');
            const submitBtn = document.getElementById('modalSubmit');

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => { content.classList.remove('scale-95', 'opacity-0'); content.classList.add('scale-100', 'opacity-100'); }, 10);

            form.innerHTML = '';
            
            if (type === 'topic') {
                title.innerText = 'Establish New Node (Topic)';
                form.innerHTML = `<input type="text" id="m_topicName" placeholder="Topic Name (e.g., Quantum Physics)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">`;
                currentModalAction = () => {
                    const val = document.getElementById('m_topicName').value.trim();
                    if(!val) return;
                    const newId = generateId();
                    appData.topics.push({ id: newId, name: val, groups: [] });
                    appData.activeTopicId = newId;
                    finalizeModal();
                };
            } else if (type === 'group') {
                title.innerText = 'Branch Out (Group Level)';
                form.innerHTML = `<input type="text" id="m_groupName" placeholder="Group Name (e.g., Core Principles)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">`;
                currentModalAction = () => {
                    const val = document.getElementById('m_groupName').value.trim();
                    if(!val) return;
                    const topic = appData.topics.find(t => t.id === appData.activeTopicId);
                    topic.groups.push({ id: generateId(), name: val, color: generateColor(), expanded: true, words: [] });
                    finalizeModal();
                };
            } else if (type === 'word') {
                title.innerText = 'Forge Knowledge Pearl (Word)';
                form.innerHTML = `
                    <input type="text" id="m_term" placeholder="Term / Keyword" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <textarea id="m_meaning" placeholder="Meaning / Definition" rows="2" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none mt-3"></textarea>
                    <input type="text" id="m_notes" placeholder="Example / Notes (Optional)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none mt-3">
                `;
                currentModalAction = () => {
                    const term = document.getElementById('m_term').value.trim();
                    const meaning = document.getElementById('m_meaning').value.trim();
                    const notes = document.getElementById('m_notes').value.trim();
                    if(!term || !meaning) return alert("Cấu trúc yêu cầu tối thiểu Term và Meaning.");
                    const topic = appData.topics.find(t => t.id === appData.activeTopicId);
                    const group = topic.groups.find(g => g.id === targetId);
                    group.words.push({ id: generateId(), term, meaning, notes });
                    group.expanded = true;
                    finalizeModal();
                };
            }

            // Xử lý nút Enter 
            submitBtn.onclick = currentModalAction;
            setTimeout(() => { form.querySelector('input').focus(); }, 100);
        }

        function closeModal() {
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
            currentModalAction = null;
        }

        function finalizeModal() { closeModal(); saveAndRender(); }

        /**
         * SỰ KIỆN TOÀN CỤC & TÍCH HỢP HỆ THỐNG
         */
        function setupEventListeners() {
            // Thanh tìm kiếm tức thì
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchQuery = e.target.value;
                renderMindmap(); // Chỉ render canvas để tối ưu tốc độ
            });

            // Active Recall Mode Toggle
            const toggleBtn = document.getElementById('toggleRecallBtn');
            toggleBtn.addEventListener('click', () => {
                recallMode = !recallMode;
                toggleBtn.classList.toggle('bg-amber-500', recallMode);
                toggleBtn.classList.toggle('bg-indigo-600', recallMode);
                toggleBtn.innerHTML = recallMode ? `<i class="fa-solid fa-eye"></i> Focus Mode On` : `<i class="fa-solid fa-eye-slash"></i> Active Recall`;
                renderMindmap();
            });

            // Bắt phím Enter trong Modal
            document.getElementById('modalForm').addEventListener('keypress', (e) => {
                if(e.key === 'Enter' && currentModalAction && e.target.tagName !== 'TEXTAREA') {
                    e.preventDefault();
                    currentModalAction();
                }
            });
        }

        /**
         * GIAO THỨC TRÍCH XUẤT VÀ NẠP DỮ LIỆU (IMPORT/EXPORT PROTOCOL)
         */
        function exportData() {
            const dataStr = JSON.stringify(appData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Zenith_Mindmap_${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (!imported.topics || !Array.isArray(imported.topics)) throw new Error("Cấu trúc Parallel Layers bị phá vỡ.");
                    appData = imported;
                    saveAndRender();
                    alert("Phục hồi mạng lưới tri thức thành công. Mọi liên kết đã được đồng bộ.");
                } catch (err) {
                    alert("Lỗi nghiêm trọng: File JSON không hợp lệ hoặc dữ liệu Pearl bị tổn thương. \nChi tiết: " + err.message);
                }
                event.target.value = ''; // Reset input
            };
            reader.readAsText(file);
        }

        // Kích hoạt lõi hệ thống
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
