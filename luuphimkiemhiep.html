<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Phim 3D Kiếm Hiệp</title>
    <style>
        :root {
            --dreamy-dark: #2A1B3D;
            --dreamy-main: #5C4B82;
            --dreamy-light: #8B78AD;
            --bg-color: #F4F2F7;
            --border-color: #D4CBE5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: var(--dreamy-dark);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .movie-card {
            background: #fff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(92, 75, 130, 0.08);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .movie-card:hover {
            border-color: var(--dreamy-main);
            box-shadow: 0 4px 12px rgba(92, 75, 130, 0.2);
        }

        .name-input {
            flex-grow: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            min-width: 0;
        }

        .name-input:focus {
            border-color: var(--dreamy-main);
        }

        .icon-selector {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 8px 4px;
            font-size: 18px;
            background: transparent;
            cursor: pointer;
            outline: none;
        }

        .ep-input {
            width: 45px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            text-align: center;
            outline: none;
            -moz-appearance: textfield;
        }

        .ep-input::-webkit-outer-spin-button,
        .ep-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .ep-controls {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .ep-controls button {
            background-color: var(--dreamy-main);
            color: white;
            border: none;
            border-radius: 3px;
            width: 24px;
            height: 16px;
            font-size: 12px;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .ep-controls button:hover {
            background-color: var(--dreamy-light);
        }

        .ep-controls button:active {
            background-color: var(--dreamy-dark);
        }

        .action-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background-color: var(--dreamy-main);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: block;
            margin: 0 auto;
            transition: background 0.3s;
        }
        
        .btn-action:hover {
            background-color: var(--dreamy-light);
        }

        .btn-disk {
            background-color: #2b8a3e;
        }
        .btn-disk:hover {
            background-color: #36b250;
        }

        .btn-delete {
            background-color: transparent;
            color: #d9534f;
            border: none;
            font-size: 16px;
            cursor: pointer;
            padding: 4px;
            margin-left: 2px;
        }

        .btn-delete:hover {
            color: #c9302c;
        }

        #file-status {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }

        @media (max-width: 1200px) { .grid-container { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 900px) { .grid-container { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <h1>Quản Lý Hoạt Hình 3D Kiếm Hiệp</h1>
    
    <div id="movie-grid" class="grid-container"></div>

    <div class="action-group">
        <button class="btn-action" onclick="addMovie()">➕ THÊM PHIM MỚI</button>
        <button class="btn-action btn-disk" onclick="DiskFileSystemManager.selectDiskFile()">📁 KẾT NỐI FILE Ổ D/E (LƯU VĨNH VIỄN)</button>
        <span id="file-status">Trạng thái: Chưa kết nối file ổ D/E</span>
    </div>

    <script>
        // Danh sách Icon tương thích 100%
        const icons = ['🗡️', '🐉', '⛩️', '📜', '🔥', '❄️', '⚡', '☯️', '🌸', '🍵'];
        
        let movies = [];

        try {
            movies = JSON.parse(localStorage.getItem('kiemHiepMovies')) || [
                { id: Date.now(), icon: '🗡️', name: '', episode: 0 }
            ];
        } catch (e) {
            movies = [{ id: Date.now(), icon: '🗡️', name: '', episode: 0 }];
        }

        // ============================================
        // INDEXEDDB ENGINE (LƯU THẺ FILEHANDLE)
        // ============================================
        const DatabaseManager = (() => {
            const DB_NAME = "KiemHiepMoviesDB";
            const DB_VERSION = 1;
            let db = null;

            const init = () => {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (e) => {
                        const tempDb = e.target.result;
                        if (!tempDb.objectStoreNames.contains("handles")) {
                            tempDb.createObjectStore("handles", { keyPath: "id" });
                        }
                    };
                    request.onsuccess = (e) => { db = e.target.result; resolve(db); };
                    request.onerror = (e) => reject(e.target.error);
                });
            };

            const saveFileHandle = async (handle) => {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction("handles", "readwrite");
                    const req = tx.objectStore("handles").put({ id: "main_file_handle", handle });
                    req.onsuccess = () => resolve();
                    req.onerror = (e) => reject(e);
                });
            };

            const getFileHandle = async () => {
                return new Promise((resolve, reject) => {
                    const tx = db.transaction("handles", "readonly");
                    const req = tx.objectStore("handles").get("main_file_handle");
                    req.onsuccess = (e) => resolve(e.target.result?.handle || null);
                    req.onerror = (e) => reject(e);
                });
            };

            return { init, saveFileHandle, getFileHandle };
        })();

        // ============================================
        // NATIVE FILE SYSTEM ACCESS API ENGINE
        // ============================================
        const DiskFileSystemManager = (() => {
            let cachedHandle = null;

            const updateStatusUI = (text, isSuccess = false) => {
                const el = document.getElementById("file-status");
                if (el) {
                    el.innerText = text;
                    el.style.color = isSuccess ? "#2b8a3e" : "#666";
                }
            };

            const verifyPermission = async (fileHandle, readWrite) => {
                const options = {};
                if (readWrite) options.mode = "readwrite";
                if ((await fileHandle.queryPermission(options)) === "granted") return true;
                if ((await fileHandle.requestPermission(options)) === "granted") return true;
                return false;
            };

            // 1. CHỌN FILE LẦN ĐẦU TỪ Ổ D/E
            const selectDiskFile = async () => {
                if (!window.showOpenFilePicker && !window.showSaveFilePicker) {
                    alert("Trình duyệt không hỗ trợ File System Access API. Vui lòng sử dụng Chrome hoặc Edge.");
                    return;
                }
                try {
                    let fileHandle;
                    if (window.showOpenFilePicker) {
                        const [handle] = await window.showOpenFilePicker({
                            types: [{
                                description: 'JSON Database File',
                                accept: { 'application/json': ['.json'] }
                            }],
                            multiple: false
                        });
                        fileHandle = handle;
                    } else {
                        fileHandle = await window.showSaveFilePicker({
                            suggestedName: 'kiemhiep_movies.json',
                            types: [{
                                description: 'JSON Files',
                                accept: { 'application/json': ['.json'] }
                            }]
                        });
                    }

                    if (fileHandle) {
                        cachedHandle = fileHandle;
                        await DatabaseManager.saveFileHandle(fileHandle);
                        const file = await fileHandle.getFile();
                        const content = await file.text();
                        
                        if (content.trim()) {
                            try {
                                movies = JSON.parse(content);
                                renderGrid();
                            } catch (e) {
                                console.error("File JSON không hợp lệ:", e);
                            }
                        } else {
                            await saveToDisk();
                        }
                        updateStatusUI(`✅ Đã kết nối: ${fileHandle.name}`, true);
                        alert("Đã kết nối thành công! Mọi thay đổi sẽ tự động ghi đè vĩnh viễn vào file ở ổ D/E.");
                    }
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        console.error("Lỗi kết nối file ổ cứng:", err);
                    }
                }
            };

            // 2. TỰ ĐỘNG NẠP FILE TỪ THẺ LƯU TRONG INDEXEDDB KHI MỞ TRÌNH DUYỆT
            const autoLoadFromDisk = async () => {
                try {
                    cachedHandle = await DatabaseManager.getFileHandle();
                    if (!cachedHandle) {
                        updateStatusUI("Trạng thái: Chưa kết nối file ổ D/E");
                        return;
                    }

                    const hasPermission = await verifyPermission(cachedHandle, false);
                    if (hasPermission) {
                        const file = await cachedHandle.getFile();
                        const content = await file.text();
                        if (content.trim()) {
                            movies = JSON.parse(content);
                            renderGrid();
                            updateStatusUI(`✅ Đã nạp từ file: ${cachedHandle.name}`, true);
                        }
                    } else {
                        updateStatusUI(`⚠️ Cần bấm nút kết nối để cấp quyền lại: ${cachedHandle.name}`);
                    }
                } catch (err) {
                    console.error("Lỗi tự động nạp file từ thẻ IndexedDB:", err);
                    updateStatusUI("⚠️ File bị đổi tên hoặc di chuyển");
                }
            };

            // 3. TỰ ĐỘNG GHI ĐÈ FILE TRÊN Ổ D/E
            const saveToDisk = async () => {
                try {
                    localStorage.setItem('kiemHiepMovies', JSON.stringify(movies));
                } catch (e) {
                    console.error("Lỗi lưu localStorage:", e);
                }

                try {
                    if (!cachedHandle) cachedHandle = await DatabaseManager.getFileHandle();
                    if (!cachedHandle) return;

                    const hasPermission = await verifyPermission(cachedHandle, true);
                    if (!hasPermission) return;

                    const writable = await cachedHandle.createWritable();
                    await writable.write(JSON.stringify(movies, null, 2));
                    await writable.close();
                } catch (err) {
                    console.error("Lỗi ghi đè trực tiếp xuống ổ D/E:", err);
                }
            };

            return { selectDiskFile, autoLoadFromDisk, saveToDisk };
        })();

        // ============================================
        // GIAO DIỆN VÀ THAO TÁC PHIM
        // ============================================
        function renderGrid() {
            const grid = document.getElementById('movie-grid');
            if (!grid) return;
            grid.innerHTML = '';

            movies.forEach((movie, index) => {
                const card = document.createElement('div');
                card.className = 'movie-card';

                // 1. Ô nhập Tên phim
                const inputName = document.createElement('input');
                inputName.type = 'text';
                inputName.className = 'name-input';
                inputName.placeholder = 'Nhập tên phim...';
                inputName.value = movie.name || '';
                inputName.oninput = (e) => updateMovie(index, 'name', e.target.value);

                // 2. Dropdown chọn Icon
                const selectIcon = document.createElement('select');
                selectIcon.className = 'icon-selector';
                icons.forEach(icon => {
                    const option = document.createElement('option');
                    option.value = icon;
                    option.text = icon;
                    if (movie.icon === icon) option.selected = true;
                    selectIcon.appendChild(option);
                });
                selectIcon.onchange = (e) => updateMovie(index, 'icon', e.target.value);

                // 3. Ô nhập Số tập
                const inputEp = document.createElement('input');
                inputEp.type = 'number';
                inputEp.className = 'ep-input';
                inputEp.value = movie.episode || 0;
                inputEp.min = 0;
                inputEp.oninput = (e) => updateMovie(index, 'episode', parseInt(e.target.value) || 0);

                // 4. Cụm nút +/- xếp dọc
                const controlsContainer = document.createElement('div');
                controlsContainer.className = 'ep-controls';

                const btnUp = document.createElement('button');
                btnUp.innerHTML = '+';
                btnUp.onclick = () => changeEpisode(index, 1);

                const btnDown = document.createElement('button');
                btnDown.innerHTML = '-';
                btnDown.onclick = () => changeEpisode(index, -1);

                controlsContainer.appendChild(btnUp);
                controlsContainer.appendChild(btnDown);

                // 5. Nút xóa phim
                const btnDelete = document.createElement('button');
                btnDelete.className = 'btn-delete';
                btnDelete.innerHTML = '✖';
                btnDelete.title = "Xóa phim này";
                btnDelete.onclick = () => deleteMovie(index);

                // Đưa các phần tử vào card: Tên -> Icon -> Số tập -> Nút +/- -> Xóa
                card.appendChild(inputName);
                card.appendChild(selectIcon);
                card.appendChild(inputEp);
                card.appendChild(controlsContainer);
                card.appendChild(btnDelete);

                grid.appendChild(card);
            });
        }

        function addMovie() {
            movies.push({ id: Date.now(), icon: '🗡️', name: '', episode: 0 });
            saveData();
            renderGrid();
        }

        function updateMovie(index, field, value) {
            movies[index][field] = value;
            saveData();
        }

        function changeEpisode(index, delta) {
            let currentEp = parseInt(movies[index].episode) || 0;
            let newEp = currentEp + delta;
            if (newEp < 0) newEp = 0;
            movies[index].episode = newEp;
            saveData();
            renderGrid();
        }

        function deleteMovie(index) {
            if (confirm('Bạn có chắc muốn xóa phim này khỏi danh sách?')) {
                movies.splice(index, 1);
                if (movies.length === 0) {
                    movies.push({ id: Date.now(), icon: '🗡️', name: '', episode: 0 });
                }
                saveData();
                renderGrid();
            }
        }

        function saveData() {
            DiskFileSystemManager.saveToDisk();
        }

        // KHỞI TẠO NĂNG LƯỢNG KHI VỪA MỞ TRANG WEB
        window.addEventListener("DOMContentLoaded", async () => {
            try {
                await DatabaseManager.init();
                renderGrid();
                await DiskFileSystemManager.autoLoadFromDisk();
            } catch (err) {
                console.error("Lỗi khởi tạo:", err);
            }
        });
    </script>
</body>
</html>
